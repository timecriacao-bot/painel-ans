name: Atualizar painel ANS

on:
  schedule:
    - cron: "0 9 5 * *"   # dia 5 de cada mês, 06h no horário de Brasília
  workflow_dispatch:       # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: read

concurrency:
  group: painel-ans
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - uses: actions/cache@v4
        with:
          path: cache
          key: ans-cache-${{ github.run_id }}
          restore-keys: ans-cache-

      # Brasil inteiro (27 UFs). Para limitar, use por exemplo: --ufs GO,MT,MS,DF,SP,RJ,MG,ES
      - name: Baixar e processar dados da ANS e do IBGE
        run: python ans_update.py

      # Cópia de segurança por 7 dias: se o envio falhar, baixe aqui e use o "Envio manual" do painel (Administração > Dados e envio).
      - name: Guardar cópia dos arquivos
        uses: actions/upload-artifact@v4
        with:
          name: painel-ans-arquivos
          path: |
            data.json.gz
            modelo-comissoes.xlsx
          retention-days: 7

      - name: Enviar ao painel
        env:
          PAINEL_URL: ${{ secrets.RAMO_PAINEL_URL }}
          PAINEL_TOKEN: ${{ secrets.RAMO_PAINEL_TOKEN }}
        run: |
          if [ -z "$PAINEL_URL" ] || [ -z "$PAINEL_TOKEN" ]; then
            echo "::error::Cadastre os secrets RAMO_PAINEL_URL e RAMO_PAINEL_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          enviar() {
            echo "Enviando $2..."
            codigo=$(curl -sS --retry 3 --retry-delay 15 --max-time 600 -o resposta.txt -w "%{http_code}" \
              -X POST "${PAINEL_URL%/}/?r=api/upload&arquivo=$1" \
              -H "X-Ramo-Token: $PAINEL_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$2") || codigo="000"
            resposta=$(head -c 300 resposta.txt 2>/dev/null | tr -d '\r\n')
            echo "HTTP $codigo: $resposta"
            case "$codigo" in
              200) return 0 ;;
              401) echo "::error::$2: token recusado (HTTP 401). Copie de novo o token em Administração > Dados ANS e atualize o secret RAMO_PAINEL_TOKEN." ;;
              404) echo "::error::$2: endereço não encontrado (HTTP 404). Confira o secret RAMO_PAINEL_URL (ex.: https://maestro.ramohub.com.br, sem barra no fim)." ;;
              422) echo "::error::$2: a conferência do painel recusou o arquivo (HTTP 422): $resposta" ;;
              403|406|429) echo "::error::$2: o firewall da hospedagem bloqueou o envio (HTTP $codigo). Use o Envio manual com o arquivo dos Artifacts e peça à Hostinger para liberar." ;;
              413) echo "::error::$2: arquivo grande demais para a hospedagem (HTTP 413). Use o Envio manual e peça à Hostinger para aumentar o limite de upload." ;;
              000) echo "::error::$2: não foi possível conectar ao painel. Confira o RAMO_PAINEL_URL e se o site está no ar com SSL." ;;
              *) echo "::error::$2: o painel respondeu HTTP $codigo: $resposta" ;;
            esac
            return 1
          }
          falhou=0
          enviar dados data.json.gz || falhou=1
          enviar modelo modelo-comissoes.xlsx || falhou=1
          exit $falhou
